name: Mod build

# Compiles the Puxl QoL mod for every supported loader and Minecraft version.
# The development sandbox cannot reach the public mavens, so this workflow is the only
# place the mod is compiled. Failed module logs are pushed into mod/build-logs/ (which is
# otherwise git-ignored) so a failure can be inspected from anywhere.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - '**'
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
      - '.github/workflows/mod-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - fabric-1.21.1
          - fabric-1.20.1
          - neoforge-1.21.1
          - forge-1.20.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build ${{ matrix.module }}
        run: |
          mkdir -p mod/build-logs
          args="--no-daemon --stacktrace"
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#mod-v}"
            args="$args -Pmod_version=$version"
          fi
          set +e
          gradle -p "mod/${{ matrix.module }}" build $args > "mod/build-logs/${{ matrix.module }}.log" 2>&1
          status=$?
          set -e
          tail -n 25 "mod/build-logs/${{ matrix.module }}.log"
          exit $status

      - name: Trim the log to its useful tail
        if: always()
        run: |
          log="mod/build-logs/${{ matrix.module }}.log"
          [ -f "$log" ] && tail -n 400 "$log" > "$log.tmp" && mv "$log.tmp" "$log" || true

      - name: Publish the log when the build failed
        if: failure() && github.ref_type == 'branch'
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -f "mod/build-logs/${{ matrix.module }}.log"
          git diff --cached --quiet && echo "no log changes" || git commit -m "chore(mod): ${{ matrix.module }} build log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git push && break || (git pull --rebase --autostash && sleep 5)
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jar-${{ matrix.module }}
          path: mod/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
