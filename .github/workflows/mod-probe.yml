name: Mod dependency probe

# One-shot helper: resolves the exact loader/plugin versions available on the public
# mavens (they are unreachable from the development sandbox) and publishes the list
# as a PR comment plus an artifact, so the mod build files can pin real versions.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mod-probe.yml'
      - '.github/scripts/probe-versions.sh'

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect maven metadata
        run: bash .github/scripts/probe-versions.sh report/versions.md > report/probe.log 2>&1 || true; tail -c 3000 report/probe.log

      - name: Publish report
        run: gh pr comment 1 --body-file report/versions.md --edit-last --create-if-none || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mod-version-probe
          path: report/
