name: Mod dependency probe

# One-shot helper: resolves the exact loader/plugin versions available on the public
# mavens (they are unreachable from the development sandbox) and publishes the list
# as a PR comment plus an artifact, so the mod build files can pin real versions.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mod-probe.yml'
      - '.github/scripts/probe-versions.sh'

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Introspect runner
        if: always()
        run: |
          {
            echo "## runner introspection"
            echo ""
            echo '```'
            echo "pwd: $(pwd)"
            echo "bash: $(bash --version | head -1)"
            echo "curl: $(curl --version | head -1)"
            echo "files:"
            ls -la
            echo "scripts:"
            ls -la .github/scripts || echo "no scripts dir"
            echo "git: $(git rev-parse --short HEAD) on $(git branch --show-current)"
            echo '```'
          } > diag.md 2>&1 || true

      - name: Run probe
        if: always()
        continue-on-error: true
        run: |
          mkdir -p report
          bash .github/scripts/probe-versions.sh report/versions.md >> diag.md 2>&1 || echo "probe exit=$?" >> diag.md
          echo "report dir:" >> diag.md
          ls -la report >> diag.md 2>&1 || true

      - name: Publish report
        if: always()
        run: |
          tail -c 20000 diag.md > diag-tail.md || true
          gh pr comment 1 --body-file diag-tail.md --edit-last --create-if-none || gh pr comment 1 --body-file diag-tail.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-version-probe
          path: |
            diag.md
            report/
