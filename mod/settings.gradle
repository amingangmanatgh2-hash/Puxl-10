pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'puxl-qol'

// One project per loader and Minecraft generation. They all compile the same shared
// sources in `common`; only the loader glue and the build file differ.
include 'fabric-1.21.1'
include 'fabric-1.20.1'
include 'neoforge-1.21.1'
include 'forge-1.20.1'
