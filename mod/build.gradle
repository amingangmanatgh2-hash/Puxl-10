// Shared configuration for every loader project. Nothing is built here directly;
// use e.g. `gradle :fabric-1.21.1:build`.
allprojects {
    group = 'dev.puxl'
    version = findProperty('mod_version') ?: '1.0.0'
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
